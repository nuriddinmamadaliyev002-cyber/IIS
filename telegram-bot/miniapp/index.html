<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>InnovateIT School</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- ════════ YUKLANISH ════════ -->
<div id="loadingPage" class="page active">
  <div class="pulse-logo">🏫</div>
  <div class="loading-label dot-anim">Tekshirilmoqda</div>
</div>

<!-- ════════ KUTISH / XABAR ════════ -->
<div id="kutishPage" class="page">
  <div class="kutish-icon" id="kutishIcon">🔒</div>
  <div class="kutish-title" id="kutishTitle">Siz hali tizimga biriktirilmagansiz</div>
  <div class="kutish-sub" id="kutishSub">
    Iltimos, maktab adminingizga murojaat qiling.
  </div>
  <div class="kutish-card" id="kutishCard">
    <div class="kutish-card-row">
      <span class="kutish-card-key">Telegram ID</span>
      <span class="kutish-card-val" id="kutishId">—</span>
    </div>
  </div>
  <button class="btn-primary" id="kutishBtn" onclick="kutishClose()" style="max-width:320px;margin-top:8px;">
    Yopish
  </button>
</div>

<!-- ════════ DASHBOARD ════════ -->
<div id="dashPage" class="page">
  <div class="topbar">
    <div class="topbar-top">
      <div>
        <div class="topbar-greeting">Xush kelibsiz,</div>
        <div class="topbar-name" id="topbarName">—</div>
      </div>
      <div class="topbar-rol" id="topbarRol">—</div>
    </div>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- ════════ DAVOMATIM PAGE (O'QUVCHI) ════════ -->
<div id="myDavomatPage" class="page">
  <div class="list-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="list-title">📋 Davomatim</div>
  </div>
  <div id="myDavomatContent" class="list-items" style="padding:12px;">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Yuklanmoqda...</div></div>
  </div>
</div>

<!-- ════════ DARS JADVALI PAGE (O'QUVCHI) ════════ -->
<div id="myJadvalPage" class="page">
  <div class="list-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="list-title">📅 Dars jadvali</div>
  </div>
  <div id="myJadvalContent" class="list-items" style="padding:12px;">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Yuklanmoqda...</div></div>
  </div>
</div>

<!-- ════════ LIST PAGE ════════ -->
<div id="listPage" class="page">
  <div class="list-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="list-title" id="listTitle">Ro'yxat</div>
  </div>
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍  Qidirish..." oninput="filterList()">
  </div>
  <div id="listContent" class="list-items">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Yuklanmoqda...</div></div>
  </div>
</div>

<!-- ════════ BOTTOM NAV ════════ -->
<div id="bottomNav" class="bottom-nav" style="display:none">
  <button class="nav-item active" id="nav-home" onclick="showDash()">
    <span class="nav-icon">🏠</span>Bosh
  </button>
  <button class="nav-item" id="nav-students" onclick="openList('students')" style="display:none">
    <span class="nav-icon">🎓</span>O'quvchi
  </button>
  <button class="nav-item" id="nav-teachers" onclick="openList('teachers')" style="display:none">
    <span class="nav-icon"><img src="img/oqituvchi-icon.png" alt="" style="height:1em;width:1em;object-fit:contain;"></span>O'qituvchi
  </button>
  <button class="nav-item" id="nav-davomat" onclick="navDavomat()" style="display:none">
    <span class="nav-icon">📋</span>Davomat
  </button>
  <button class="nav-item" id="nav-tolov" onclick="openList('tolov')" style="display:none">
    <span class="nav-icon">💰</span>To'lov
  </button>
</div>

  <script src="app.js?v=5"></script>
</body>
</html>
