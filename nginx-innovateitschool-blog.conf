# ─── Ijtimoiy tarmoq/messenger botlarini User-Agent orqali aniqlash ───
# Bu botlar (Telegram, Facebook, Twitter/X, WhatsApp, LinkedIn va h.k.)
# JavaScript ishlatmaydi — ular link preview (rasm+sarlavha) uchun sahifani
# ochganda faqat boshlang'ich HTML'ni o'qiydi. Shu sabab /post.html ular
# uchun backenddagi tayyor (server-side) preview sahifasiga yo'naltiriladi.
map $http_user_agent $is_social_bot {
    default 0;
    ~*TelegramBot        1;
    ~*facebookexternalhit 1;
    ~*Facebot            1;
    ~*Twitterbot         1;
    ~*LinkedInBot        1;
    ~*WhatsApp           1;
    ~*Slackbot           1;
    ~*Discordbot         1;
    ~*SkypeUriPreview    1;
    ~*Viber              1;
    ~*vkShare            1;
    ~*Pinterest          1;
    ~*Applebot           1;
}

server {
    listen 80;
    listen 443 ssl;
    server_name innovateitschool.uz www.innovateitschool.uz;

    # Vaqtinchalik self-signed sertifikat (new.innovateitschool.uz bilan bir xil).
    # PUBLIC sayt bo'lgani uchun certbot bilan REAL sertifikat olish tavsiya etiladi:
    #   sudo certbot --nginx -d innovateitschool.uz -d www.innovateitschool.uz
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Frontend (ochiq blog sayti)
    root /var/www/IIS/innovateit-blog-frontend;
    index index.html;

    # Post sahifasi — bot bo'lsa, backenddagi tayyor og:title/og:image
    # preview'ga yo'naltiriladi; oddiy foydalanuvchi hozirgidek statik
    # post.html'ni (JS bilan) oladi.
    location = /post.html {
        if ($is_social_bot) {
            proxy_pass http://127.0.0.1:3002/ssr/post-preview$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Backend API (bir xil backend, CRM bilan baham ko'riladi)
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploads (statik fayllar - muqova rasmlar)
    location ^~ /uploads/ {
        alias /var/www/IIS/innovateit-backend/uploads/;
    }

    # Statik fayllar keshi
    location ~* \.(css|js|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ESLATMA:
# - Bu fayl FAQAT innovateitschool.uz (blog) uchun.
# - new.innovateitschool.uz konfiguratsiyasiga (CRM) HECH QANDAY o'zgartirish
#   kiritilmagan - u alohida faylda, ishlab turibdi.
# - Ikkalasi ham bitta backendga (127.0.0.1:3002, PM2 process: innovateit-crm)
#   ulanadi - bu qasddan shunday.
