<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>InnovateIT School — Davomat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/davomat.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/hover.css"> 
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">InnovateIT School · Davomat</div>
  <div class="topbar-right">
    <span class="admin-badge" id="dav-badge"></span>
    <button class="btn-logout" onclick="goBack()">← Orqaga</button>
    <button class="btn-export" onclick="openExportModal()">📊 Excel</button>
  </div>
</div>

<!-- DATE BAR -->
<div class="date-bar">
  <div class="date-nav">
    <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
    <div style="text-align:center;">
      <div class="date-display" id="date-display">—</div>
      <div class="date-sub"    id="date-sub">—</div>
    </div>
    <button class="date-nav-btn" id="btn-next" onclick="changeDate(1)">›</button>
  </div>
  <input class="date-input" type="date" id="date-picker" onchange="onDatePick()">
</div>

<div class="dav-main">

  <!-- STAT KARTALAR — admin shu kartalarni bosib pastdagi jadvalni filtrlaydi -->
  <div class="stat-grid">
    <div class="stat-card keldi"   id="card-keldi"   onclick="toggleFilter('keldi')">
      <div class="stat-card-lbl"><span class="stat-card-dot"></span>Keldi</div>
      <div class="stat-card-num" id="st-keldi">0</div>
    </div>
    <div class="stat-card kelmadi" id="card-kelmadi" onclick="toggleFilter('kelmadi')">
      <div class="stat-card-lbl"><span class="stat-card-dot"></span>Kelmadi</div>
      <div class="stat-card-num" id="st-kelmadi">0</div>
    </div>
    <div class="stat-card sababli" id="card-sababli" onclick="toggleFilter('sababli')">
      <div class="stat-card-lbl"><span class="stat-card-dot"></span>Sababli</div>
      <div class="stat-card-num" id="st-sababli">0</div>
    </div>
    <div class="stat-card kech"    id="card-kech"    onclick="toggleFilter('kech')">
      <div class="stat-card-lbl"><span class="stat-card-dot"></span>Kech</div>
      <div class="stat-card-num" id="st-kech">0</div>
    </div>
    <div class="stat-card total">
      <div class="stat-card-lbl">Jami</div>
      <div class="stat-card-num" id="st-total">0</div>
    </div>
  </div>

  <!-- QIDIRUV -->
  <div class="dav-toolbar">
    <input class="dav-search" type="text" id="dav-search" placeholder="O'quvchi qidirish…" oninput="renderTable()">
  </div>

  <!-- DAVOMAT JADVALI — standart holatda barcha o'quvchilar ko'rinadi -->
  <!-- Sinf (guruh) bo'yicha guruhlangan, har bir guruh yonida shu kunga biriktirilgan fan ko'rsatiladi -->
  <div class="dav-table-wrap tbl-wrap">
    <table class="dav-table">
      <thead>
        <tr>
          <th>familiya ism</th>
          <th>Holat</th>
          <th>Izoh</th>
        </tr>
      </thead>
      <tbody id="dav-tbody"></tbody>
    </table>
  </div>

  <!-- MOBIL KARTALAR — 768px dan kichik ekranlarda tbl-wrap o'rniga ko'rinadi -->
  <div class="mobile-list" id="dav-mobile-list"></div>

</div>

<!-- MODAL: Excel yuklab olish -->
<div class="modal-overlay" id="export-modal" onclick="if(event.target===this)closeExportModal()">
  <div class="modal" style="max-width:400px;">
    <div class="modal-drag"></div>
    <div class="modal-title" style="text-align:center;">📊 Excel yuklab olish</div>

    <!-- Tur tanlash -->
    <div class="export-tabs" id="export-tabs">
      <button class="export-tab active" onclick="selectExportType('bugun',this)">Bugungi</button>
      <button class="export-tab" onclick="selectExportType('oylik',this)">Oylik</button>
      <button class="export-tab" onclick="selectExportType('davr',this)">Davr</button>
    </div>

    <!-- Bugungi kun — hech qanday tanlov yo'q -->
    <div id="exp-bugun" class="export-section">
      <p class="export-hint">Joriy ko'rilayotgan sana uchun davomat yuklanadi.</p>
      <div class="export-preview" id="exp-bugun-preview"></div>
    </div>

    <!-- Oylik -->
    <div id="exp-oylik" class="export-section" style="display:none;">
      <label class="field-label">Oy tanlang</label>
      <input type="month" id="exp-month-pick" class="field-input" style="margin-bottom:8px;">
      <div class="export-preview" id="exp-oylik-preview"></div>
    </div>

    <!-- Davr -->
    <div id="exp-davr" class="export-section" style="display:none;">
      <label class="field-label">Boshlanish sanasi</label>
      <input type="text" id="exp-from" class="field-input" placeholder="DD.MM.YYYY" maxlength="10"
        style="margin-bottom:8px;letter-spacing:1px;" oninput="onDavrInput(this)" autocomplete="off">
      <label class="field-label">Tugash sanasi</label>
      <input type="text" id="exp-to" class="field-input" placeholder="DD.MM.YYYY" maxlength="10"
        style="margin-bottom:8px;letter-spacing:1px;" oninput="onDavrInput(this)" autocomplete="off">
      <div class="export-preview" id="exp-davr-preview"></div>
    </div>

    <div class="modal-footer" style="margin-top:16px;">
      <button class="btn-cancel" onclick="closeExportModal()">Bekor</button>
      <button class="btn-submit" id="btn-do-export" onclick="doExport()">
        <span class="spinner" id="exp-spinner" style="display:none;"></span>
        <span id="exp-txt">⬇ Yuklab olish</span>
      </button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading-ov"><div class="loading-spinner"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/api.js"></script>
  <script src="js/davomat.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
